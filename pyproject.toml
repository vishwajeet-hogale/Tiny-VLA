[project]
name = "tiny-vla"
version = "0.1.0"
description = "A learning project for robot learning with Hugging Face LeRobot."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Pinned exactly: the LeRobot API changes between versions.
    "lerobot[pusht,diffusion,training]==0.6.1",
    "matplotlib>=3.11.2",
    "tensorboard>=2.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tiny_vla"]

[tool.uv]
# lerobot requires opencv-python-headless and gym-pusht requires opencv-python. Both install
# into the same cv2/ folder and overwrite each other, and the headless build has no GUI
# (cv2.imshow fails). Keep one OpenCV: the GUI build, at the version lerobot is tested with.
override-dependencies = [
    "opencv-python==4.13.0.92",
    "opencv-python-headless; sys_platform == 'never'",  # never install the headless build
]
